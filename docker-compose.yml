# Production stack: the app + PostgreSQL.
#   1. cp .env.production.example .env.production   (then edit the values)
#   2. docker compose --env-file .env.production up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rendezvous
      POSTGRES_USER: rendezvous
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rendezvous -d rendezvous"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rendezvous:${POSTGRES_PASSWORD}@db:5432/rendezvous
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SEED_DEMO_DATA: "false"
      # Set to "false" only if you serve the site over plain HTTP (no TLS).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/storage
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FREE_AI_API_KEY: ${FREE_AI_API_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}
      BGG_API_TOKEN: ${BGG_API_TOKEN:-}
    volumes:
      - uploads:/app/storage
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
